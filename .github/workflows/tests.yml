name: CPU unit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-test.txt
      - name: Compile Python source
        run: python -m compileall -q configs data model training evaluation scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check command-line help
        run: |
          python scripts/build_pairs.py --help > /dev/null
          python scripts/train.py --help > /dev/null
          python scripts/evaluate_fold.py --help > /dev/null
