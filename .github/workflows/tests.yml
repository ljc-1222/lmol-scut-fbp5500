name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.24,<2' 'Pillow>=10' 'PyYAML>=6'
      - name: Check syntax
        run: python -m compileall -q configs data evaluation model scripts tests training
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI entry points
        run: |
          python scripts/build_pairs.py --help > /dev/null
          python scripts/train.py --help > /dev/null
          python scripts/evaluate_fold.py --help > /dev/null
